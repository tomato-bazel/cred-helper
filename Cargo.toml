# fastverk/cred-helper — the standalone universal Bazel credential helper +
# its reusable `credresolve` core. Built with @rules_rust + crate_universe
# (from this cargo workspace); published as prebuilt release artifacts and as
# the `fastverk_credresolve` Bazel module.
[workspace]
members = ["credresolve", "cred-helper", "oidc"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/fastverk/cred-helper"

[workspace.dependencies]
anyhow = "1.0"
prost = "0.13"
# See credresolve/Cargo.toml — required by the prost TOOLCHAIN, not by any code.
prost-types = "0.13"
directories = "5.0"
keyring = { version = "3", features = ["apple-native"] }
# fastverk-oidc only: a small blocking HTTP client (rustls) for the one-shot
# OIDC token exchange. Kept out of credresolve + the hot-path cred-helper.
ureq = "2"
serde_json = "1"
